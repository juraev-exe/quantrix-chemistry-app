<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#101e38" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" stroke="#00f0ff" stroke-width="8" />

  <!-- Target Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="12" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00f0ff" stroke-width="8" stroke-dasharray="24 16" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#ff2a55" stroke-width="8" />
  <circle cx="256" cy="256" r="30" fill="#00ff66" />

  <!-- Sniper Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#00f0ff" stroke-width="6" opacity="0.8" />
  <line x1="40" y1="256" x2="472" y2="256" stroke="#00f0ff" stroke-width="6" opacity="0.8" />

  <!-- Keyboard Key Emblems -->
  <rect x="186" y="360" width="140" height="48" rx="8" fill="#1e293b" stroke="#00ff66" stroke-width="4" />
  <text x="256" y="392" font-family="monospace" font-size="24" font-weight="bold" fill="#00ff66" text-anchor="middle">FIRE</text>
</svg>

