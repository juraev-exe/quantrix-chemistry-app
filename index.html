<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Student Projects Showcase" />
  <title>Student Projects</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('student_dashboard_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/dashboard.css" />
</head>
<body>

  <!-- Minimal Header -->
  <header class="minimal-nav">
    <div class="nav-container">
      <div class="nav-brand">Student Projects</div>

      <div class="nav-actions">
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="search-input" placeholder="Search student..." autocomplete="off" aria-label="Search student projects" />
        </div>

        <button id="theme-toggle" class="theme-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
          <span class="theme-icon">◐</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Showcase Cards Grid -->
  <main class="showcase-container">
    <div id="projects-grid" class="cards-grid">
      <!-- Minimalist cards rendered dynamically via src/dashboard.js -->
    </div>
  </main>

  <script type="module" src="/src/dashboard.js"></script>
</body>
</html>
