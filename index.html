<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Projects</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('student_dashboard_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/dashboard.css" />
</head>
<body>

  <header class="nav-header">
    <div class="nav-wrap">
      <h1 class="brand-title">Student Projects</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
        <span>◐</span>
      </button>
    </div>
  </header>

  <main class="showcase-main">
    <div id="projects-grid" class="cards-grid">
      <!-- Minimalist cards rendered via src/dashboard.js -->
    </div>
  </main>

  <script type="module" src="/src/dashboard.js"></script>
</body>
</html>
